# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.prod.yml
# Production stack for Model Wars.
# All secrets come from .env — never commit that file.
#
# Usage:
#   cp .env.example .env && vim .env
#   docker compose -f docker-compose.prod.yml up -d
# ─────────────────────────────────────────────────────────────────────────────

version: "3.9"

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mw-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Run schema on first start
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  # ── Game server ─────────────────────────────────────────────────────────────
  game-server:
    build:
      context: .
      dockerfile: apps/game-server/Dockerfile
    container_name: mw-game-server
    restart: unless-stopped
    environment:
      NODE_ENV:          production
      DATABASE_URL:      postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY:    ${OPENAI_API_KEY}
      JWT_SECRET:        ${JWT_SECRET}
      JWT_EXPIRY_DAYS:   ${JWT_EXPIRY_DAYS:-7}
      GAME_SERVER_PORT:  3001
      CORS_ORIGINS:      ${CORS_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal, external]
    # Don't expose port 3001 to host — nginx proxies it
    expose: ["3001"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ── Next.js frontend ────────────────────────────────────────────────────────
  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    container_name: mw-web
    restart: unless-stopped
    environment:
      NODE_ENV:                     production
      NEXT_PUBLIC_GAME_SERVER_URL:  ${NEXT_PUBLIC_GAME_SERVER_URL}
      NEXT_PUBLIC_WS_URL:           ${NEXT_PUBLIC_WS_URL}
      GAME_SERVER_URL:              http://game-server:3001
    depends_on:
      game-server:
        condition: service_healthy
    networks: [internal, external]
    expose: ["3000"]

  # ── Nginx reverse proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: mw-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/certs:/etc/nginx/certs:ro   # mount TLS certs here
      - nginx_logs:/var/log/nginx
    depends_on: [web, game-server]
    networks: [external]

volumes:
  postgres_data:
  nginx_logs:

networks:
  internal:
    driver: bridge
    internal: true   # postgres not reachable from outside
  external:
    driver: bridge
