# ─────────────────────────────────────────────────────────────────────────────
# infra/nginx.conf
# Reverse proxy for Model Wars:
#   /          → Next.js web (port 3000)
#   /api/*     → game-server (port 3001)
#   /socket.io → game-server WebSocket (with upgrade headers)
#
# For TLS: place fullchain.pem + privkey.pem in ./infra/certs/
# and uncomment the HTTPS server block below.
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
  worker_connections 4096;
  use epoll;
}

http {
  include      /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ── Logging ──────────────────────────────────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  # ── Tuning ───────────────────────────────────────────────────────────────
  sendfile           on;
  tcp_nopush         on;
  keepalive_timeout  65;
  gzip               on;
  gzip_types         text/plain text/css application/json application/javascript
                     text/xml application/xml text/javascript;

  # ── Rate limiting ─────────────────────────────────────────────────────────
  # 60 req/min per IP on API endpoints; burst of 10
  limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
  # 10 req/min per IP on auth endpoints (brute-force protection)
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

  # ── Upstream definitions ──────────────────────────────────────────────────
  upstream game_server {
    server game-server:3001;
    keepalive 32;
  }

  upstream web_app {
    server web:3000;
    keepalive 16;
  }

  # ── HTTP server (redirects to HTTPS in production) ────────────────────────
  server {
    listen 80;
    server_name _;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    # Uncomment to force HTTPS once certs are in place:
    # return 301 https://$host$request_uri;

    # ── Auth routes — stricter rate limit ──────────────────────────────────
    location ~ ^/api/auth/ {
      limit_req zone=auth burst=5 nodelay;
      proxy_pass         http://game_server;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── API routes ─────────────────────────────────────────────────────────
    location /api/ {
      limit_req zone=api burst=10 nodelay;
      proxy_pass         http://game_server;
      proxy_http_version 1.1;
      proxy_set_header   Connection        "";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Socket.io — WebSocket upgrade ─────────────────────────────────────
    location /socket.io/ {
      proxy_pass             http://game_server;
      proxy_http_version     1.1;
      proxy_set_header       Upgrade    $http_upgrade;
      proxy_set_header       Connection "upgrade";
      proxy_set_header       Host       $host;
      proxy_set_header       X-Real-IP  $remote_addr;
      proxy_read_timeout     3600s;   # keep WS connections alive
      proxy_send_timeout     3600s;
    }

    # ── Next.js frontend (everything else) ────────────────────────────────
    location / {
      proxy_pass         http://web_app;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
  }

  # ── HTTPS server (uncomment when certs are ready) ─────────────────────────
  # server {
  #   listen 443 ssl http2;
  #   server_name yourdomain.com;
  #
  #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
  #   ssl_protocols       TLSv1.2 TLSv1.3;
  #   ssl_ciphers         HIGH:!aNULL:!MD5;
  #
  #   ... (same location blocks as above)
  # }
}
