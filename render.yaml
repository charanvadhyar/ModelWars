services:
  - type: web
    name: model-wars-game-server
    runtime: node
    rootDir: apps/game-server
    buildCommand: npm install
    startCommand: npx tsx src/index.ts
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRY_DAYS
        value: 7
      - key: CORS_ORIGINS
        sync: false
